plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dasepa.fourwordquiz'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dasepa.fourwordquiz'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../dist']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
}
