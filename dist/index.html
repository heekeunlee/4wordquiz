<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff9e9">
<meta name="description" content="초등학생을 위한 간단한 사자성어 퀴즈 30개">
<title>사자성어 퀴즈</title>
<style>
:root{--bg:#fff9e9;--ink:#263640;--muted:#687a80;--green:#33866d;--green-dark:#246c56;--mint:#e5f7ec;--yellow:#ffe17a;--pink:#ffe9e2;--blue:#e3f4fa;--line:#e9e5d7;--white:#fff;--shadow:0 8px 24px #304a3510;--font:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);min-height:100vh}.shell{width:min(100% - 32px,680px);margin:0 auto;padding:12px 0 32px}.topbar{display:flex;align-items:center;gap:9px;padding:5px 1px 13px;border-bottom:1px solid var(--line)}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:13px;background:var(--yellow);color:#68531c;font-weight:900;font-size:19px}.brand{font-weight:900;font-size:17px;letter-spacing:-.04em}.total{margin-left:auto;background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:99px;color:var(--muted);font-size:12px;font-weight:800}.intro{padding:23px 3px 18px}.kicker{display:inline-block;padding:5px 10px;background:var(--mint);border-radius:99px;color:var(--green-dark);font-size:12px;font-weight:850}.intro h1{font-size:29px;line-height:1.35;letter-spacing:-.05em;margin:10px 0 5px;font-weight:900;word-break:keep-all}.intro p{font-size:14px;color:var(--muted);margin:0}.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:18px 17px 16px;box-shadow:var(--shadow)}.question-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}.tag{background:#fff4ce;color:#6d591f;padding:6px 10px;border-radius:99px}.progress{height:8px;background:#f0efe8;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;border-radius:inherit;background:var(--green);transition:width .2s}.prompt-label{font-size:13px;font-weight:800;color:var(--green-dark);margin:0 0 7px}.prompt{font-size:21px;line-height:1.65;letter-spacing:-.025em;margin:0 0 17px;font-weight:850;word-break:keep-all}.answers{display:grid;grid-template-columns:1fr;gap:8px}.answer{display:flex;align-items:center;gap:12px;min-height:60px;width:100%;border:2px solid #e9e9df;background:#fffefa;border-radius:15px;padding:10px 12px;text-align:left;color:var(--ink);font:750 16px/1.45 var(--font);touch-action:manipulation}.answer:hover:not(:disabled){border-color:#98ceb0;background:#f5fff8}.answer:active:not(:disabled){transform:scale(.99)}.answer:disabled{cursor:default}.letter{display:grid;place-items:center;flex:none;width:33px;height:33px;border-radius:11px;background:#f1f2eb;color:#586960;font-size:13px;font-weight:900}.answer:nth-child(1) .letter{background:#fff2cf}.answer:nth-child(2) .letter{background:#e4f4fb}.answer:nth-child(3) .letter{background:#fce8e4}.answer:nth-child(4) .letter{background:#e6f5e9}.answer.correct{border-color:#72c493;background:#edfff2}.answer.correct .letter{background:#c6efd4;color:#286644}.answer.wrong{border-color:#efa093;background:#fff2ef}.answer.wrong .letter{background:#ffdfd8;color:#a64437}.feedback{min-height:39px;display:flex;align-items:center;padding-top:7px;font-size:14px;font-weight:800;color:var(--muted)}.feedback.good{color:var(--green-dark)}.feedback.bad{color:#ad4d40}.actions{display:flex;justify-content:flex-end;margin-top:4px}.btn{border:0;border-radius:13px;background:var(--green);color:#fff;padding:12px 17px;font:850 14px var(--font);box-shadow:0 3px 0 var(--green-dark);touch-action:manipulation}.btn:disabled{opacity:.38;box-shadow:none}.btn.secondary{background:#fff;color:var(--green-dark);border:1px solid #cbded1;box-shadow:none}.done{text-align:center;padding:17px 3px 12px}.done .icon{font-size:40px;line-height:1}.done h2{font-size:26px;line-height:1.35;margin:10px 0 4px}.done p{color:var(--muted);font-size:15px;margin:0}.done strong{color:var(--green-dark);font-size:19px}.mistakes{margin:19px 0;text-align:left;background:#fffaf1;border-radius:14px;padding:12px 14px}.mistakes h3{font-size:13px;margin:0 0 7px;color:#52675d}.mistakes p{font-size:13px;margin:0;padding:8px 0;border-top:1px solid #eee8da;line-height:1.55}.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:15px}.wordbook{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:0 14px;box-shadow:0 4px 14px #304a3508}.wordbook summary{display:flex;align-items:center;gap:8px;min-height:50px;list-style:none;cursor:pointer;font-size:15px;font-weight:850}.wordbook summary::-webkit-details-marker{display:none}.book-count{font-size:11px;color:var(--muted);font-weight:700}.plus{margin-left:auto;font-size:19px;color:var(--green)}.wordbook[open] .plus{transform:rotate(45deg)}.word-list{padding:0 0 8px}.word{display:flex;align-items:baseline;gap:9px;border-top:1px solid #f0eee7;padding:8px 1px}.word b{flex:none;color:var(--green-dark);font-size:14px;font-weight:900}.word span{color:#617178;font-size:12px;line-height:1.5}.footer{text-align:center;color:#82908c;font-size:11px;font-weight:700;margin-top:17px}button:focus-visible,summary:focus-visible{outline:3px solid #efb545;outline-offset:2px}
@media(min-width:600px){.shell{padding-top:20px}.intro{padding-top:31px;padding-bottom:22px}.intro h1{font-size:33px}.card{padding:22px 24px 20px}.prompt{font-size:23px}.answers{grid-template-columns:1fr 1fr}.answer{min-height:70px;padding:12px 14px}.word-list{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}}
@media(max-width:360px){.shell{width:min(100% - 24px,680px)}.intro h1{font-size:26px}.prompt{font-size:19px}.answer{font-size:15px;min-height:56px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><span class="logo" aria-hidden="true">四</span><span class="brand">사자성어 퀴즈</span><span class="total">30개</span></header>
<main>
<section class="intro"><span class="kicker">오늘의 10문제</span><h1>뜻을 읽고<br>맞는 말을 골라 봐요!</h1><p>보기에서 정답을 누르면 돼요. 틀려도 괜찮아요!</p></section>
<section class="card" id="quiz-card" aria-live="polite" aria-label="퀴즈"></section>
<details class="wordbook"><summary><span aria-hidden="true">📚</span> 단어장 <span class="book-count">30개</span><span class="plus" aria-hidden="true">＋</span></summary><div class="word-list" id="word-list"></div></details>
</main><footer class="footer">한 문제씩 차근차근! 🌱</footer>
</div>
<script>
const idioms=[
{word:'대기만성',meaning:'큰 인물은 늦게라도 성공해요.'},
{word:'마부작침',meaning:'꾸준히 노력하면 어려운 일도 이룰 수 있어요.'},
{word:'우공이산',meaning:'포기하지 않고 노력하면 큰일을 이룰 수 있어요.'},
{word:'형설지공',meaning:'어려운 환경에서도 열심히 공부해 성공해요.'},
{word:'화룡점정',meaning:'마지막으로 중요한 부분을 완성해요.'},
{word:'군계일학',meaning:'여럿 가운데 유난히 뛰어난 사람이에요.'},
{word:'낭중지추',meaning:'재주가 뛰어난 사람은 저절로 눈에 띄어요.'},
{word:'백문불여일견',meaning:'직접 보는 것이 여러 번 듣는 것보다 나아요.'},
{word:'백미',meaning:'여럿 중에서 가장 뛰어난 사람이나 물건이에요.'},
{word:'삼고초려',meaning:'인재를 얻으려고 정성을 다해 찾아가요.'},
{word:'좌우명',meaning:'마음에 새겨 두고 늘 본받는 말이에요.'},
{word:'천리안',meaning:'먼 곳에서 일어난 일도 꿰뚫어 보는 능력이에요.'},
{word:'결초보은',meaning:'받은 은혜를 잊지 않고 갚아요.'},
{word:'관포지교',meaning:'마음이 잘 맞는 친구 사이의 깊은 우정이에요.'},
{word:'단장',meaning:'가슴이 끊어질 듯 슬픈 이별이에요.'},
{word:'도원결의',meaning:'뜻이 맞는 사람들이 함께하기로 굳게 약속해요.'},
{word:'맹모삼천',meaning:'아이를 잘 키우려면 좋은 환경이 중요해요.'},
{word:'지음',meaning:'말하지 않아도 내 마음을 알아주는 친구예요.'},
{word:'각주구검',meaning:'옛 방법만 고집해 변화를 모르는 모습이에요.'},
{word:'기우',meaning:'하지 않아도 될 쓸데없는 걱정이에요.'},
{word:'모순',meaning:'앞뒤가 서로 맞지 않는 말이나 행동이에요.'},
{word:'사족',meaning:'쓸데없는 일을 더해 일을 망쳐요.'},
{word:'새옹지마',meaning:'좋은 일과 나쁜 일은 어떻게 바뀔지 몰라요.'},
{word:'어부지리',meaning:'두 사람이 다투는 사이 다른 사람이 이익을 얻어요.'},
{word:'조삼모사',meaning:'눈앞의 차이만 보고 결과가 같은 걸 몰라요.'},
{word:'개과천선',meaning:'잘못을 고치고 착한 사람으로 바뀌어요.'},
{word:'교토삼굴',meaning:'어려움에 대비해 꾀를 미리 마련해 둬요.'},
{word:'완벽',meaning:'흠이 없이 아주 훌륭해요.'},
{word:'일거양득',meaning:'한 가지 일로 두 가지 이익을 얻어요.'},
{word:'환골탈태',meaning:'모습이나 생각이 완전히 새롭게 바뀌어요.'}
];
const $=s=>document.querySelector(s),card=$('#quiz-card');let questions=[],index=0,score=0,missed=[];
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function begin(list=shuffle(idioms).slice(0,10)){questions=list;index=0;score=0;missed=[];showQuestion()}
function showQuestion(){if(index>=questions.length){showResults();return}const q=questions[index],choices=shuffle([q,...shuffle(idioms.filter(x=>x!==q)).slice(0,3)]);card.innerHTML=`<div class="question-meta"><span class="tag">문제 ${index+1} / ${questions.length}</span><span>맞힌 문제 ${score}개</span></div><div class="progress"><i style="width:${index/questions.length*100}%"></i></div><p class="prompt-label">어떤 사자성어일까요?</p><p class="prompt">${esc(q.meaning)}</p><div class="answers">${choices.map((o,i)=>`<button class="answer" data-word="${esc(o.word)}"><span class="letter">${i+1}</span><span>${esc(o.word)}</span></button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn" id="next" disabled>${index===questions.length-1?'결과 보기':'다음 문제'}　›</button></div>`;card.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>choose(b,q)));$('#next').addEventListener('click',()=>{index++;showQuestion()})}
function choose(button,q){if(button.disabled)return;const correct=button.dataset.word===q.word;card.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.word===q.word)b.classList.add('correct')});const feedback=$('#feedback');if(correct){score++;feedback.className='feedback good';feedback.textContent='정답이에요! 잘했어요 ⭐'}else{button.classList.add('wrong');missed.push(q);feedback.className='feedback bad';feedback.textContent=`괜찮아요! 정답은 ${q.word}예요.`}card.querySelector('.question-meta span:last-child').textContent=`맞힌 문제 ${score}개`;$('#next').disabled=false}
function showResults(){const total=questions.length,pct=Math.round(score/total*100);card.innerHTML=`<div class="done"><div class="icon">${score===total?'🏆':score>=total/2?'🌟':'🌱'}</div><h2>${score===total?'모두 맞혔어요!':'끝까지 잘했어요!'}</h2><p><strong>${total}개 중 ${score}개</strong> 정답</p>${missed.length?`<div class="mistakes"><h3>다시 볼 단어</h3>${missed.map(x=>`<p><b>${esc(x.word)}</b> — ${esc(x.meaning)}</p>`).join('')}</div>`:''}<div class="result-actions">${missed.length?'<button class="btn secondary" id="retry">틀린 문제 다시 풀기</button>':''}<button class="btn" id="new-round">새 문제 10개</button></div></div>`;$('#new-round').addEventListener('click',()=>begin());const retry=$('#retry');if(retry)retry.addEventListener('click',()=>begin(shuffle(missed)))}
$('#word-list').innerHTML=idioms.map(x=>`<div class="word"><b>${esc(x.word)}</b><span>${esc(x.meaning)}</span></div>`).join('');begin();
</script>
</body>
</html>
