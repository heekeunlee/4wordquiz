<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f6f3ec" />
<meta name="description" content="사진 속 고사성어 30개를 랜덤 퀴즈로 익혀요." />
<title>사자성어 한 판</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--paper:#f6f3ec;--ink:#17271f;--muted:#7b8279;--green:#365844;--lime:#d8e583;--line:#deddd2;--white:#fffefa;--red:#b64c3d;--serif:'Gowun Batang',serif;--sans:'Manrope',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh}button{font:inherit;cursor:pointer}.shell{max-width:1120px;margin:auto;padding:26px 32px 46px}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0 20px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.04em;font-size:17px}.brand-mark{display:grid;place-items:center;background:var(--green);color:var(--lime);width:34px;height:34px;border-radius:10px;font-family:var(--serif);font-weight:bold;font-size:18px}.topnote{font-family:'DM Mono',monospace;color:var(--muted);font-size:11px;letter-spacing:.08em}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:56px;padding-top:55px}.eyebrow{font-family:'DM Mono',monospace;color:var(--green);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.intro h1{font:700 42px/1.28 var(--serif);letter-spacing:-.07em;margin:16px 0 12px}.intro h1 em{font-style:normal;color:var(--green)}.intro p{font-size:14px;line-height:1.8;color:#687168;margin:0;max-width:250px}.stats{display:flex;gap:22px;margin-top:35px;padding-top:20px;border-top:1px solid var(--line)}.stat b{font:700 23px var(--serif);display:block}.stat span{font-family:'DM Mono',monospace;color:var(--muted);font-size:10px;letter-spacing:.08em}.board{min-width:0}.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--line);color:#687168;background:transparent;border-radius:99px;padding:8px 12px;font-size:12px}.pill.active{background:var(--green);border-color:var(--green);color:white}.round-select{border:0;border-bottom:1px solid #a5aa9c;color:var(--ink);background:transparent;padding:8px 2px;font-size:12px;outline:none}.card{background:var(--white);border:1px solid #e8e5db;border-radius:18px;box-shadow:0 12px 40px #17271f0a;padding:26px 30px 28px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lime)}.card-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font:11px 'DM Mono',monospace;letter-spacing:.08em}.count{color:var(--green)}.progress{height:3px;background:#eeede6;margin:17px 0 28px;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}.prompt-label{color:#9a9e94;font:10px 'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase;margin:0 0 11px}.prompt{font:700 30px/1.55 var(--serif);letter-spacing:-.05em;margin:0 0 7px;word-break:keep-all}.hint{font-size:13px;color:#91958b;margin:0 0 23px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{display:flex;align-items:flex-start;gap:11px;text-align:left;background:#fbfaf6;border:1px solid #e8e7de;color:var(--ink);border-radius:11px;padding:13px 14px;min-height:58px;transition:all .16s}.answer:hover:not(:disabled){border-color:#78917c;background:#f5f7ee;transform:translateY(-1px)}.answer:disabled{cursor:default}.letter{flex:none;color:#9ba194;font:11px 'DM Mono',monospace;padding-top:3px}.answer-text{font:14px/1.55 var(--serif);word-break:keep-all}.answer.correct{border-color:#5b8061;background:#edf4e9}.answer.correct .letter{color:#31583c}.answer.wrong{border-color:#d8a49b;background:#faf0ed}.answer.wrong .letter{color:var(--red)}.feedback{min-height:36px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-top:12px}.feedback.good{color:#365844}.feedback.bad{color:var(--red)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--green);color:white;font-weight:700;font-size:12px;transition:transform .15s,opacity .15s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}.btn.secondary{background:transparent;border:1px solid var(--line);color:#687168}.done{text-align:center;padding:36px 16px}.done .trophy{font-size:34px}.done h2{font:700 31px var(--serif);margin:12px 0 8px}.done p{color:var(--muted);font-size:14px;line-height:1.7}.done strong{color:var(--green)}.mistakes{margin:24px auto 0;text-align:left;max-width:470px}.mistakes h3{font:11px 'DM Mono',monospace;letter-spacing:.1em;color:var(--muted)}.mistakes p{border-bottom:1px solid var(--line);padding:8px 0;margin:0;color:var(--ink);font-family:var(--serif)}.vocab{margin-top:37px}.vocab-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.vocab-head h2{font:700 19px var(--serif);margin:0}.vocab-head span{font:10px 'DM Mono',monospace;letter-spacing:.1em;color:var(--muted)}.vocab-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.word{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding:9px 2px}.word b{font:700 13px var(--serif);white-space:nowrap}.word span{font-size:10px;color:#81877d;text-align:right;line-height:1.5}.footer{font:10px 'DM Mono',monospace;color:#9a9e94;margin-top:32px;letter-spacing:.05em}.mobile-stats{display:none}
@media(max-width:760px){.shell{padding:12px 16px 28px}.topbar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px 11px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{font-size:15px;gap:9px}.brand-mark{width:31px;height:31px}.topnote{font-size:8px;letter-spacing:.04em}.layout{grid-template-columns:1fr;gap:18px;padding-top:22px}.intro h1{font-size:29px;line-height:1.2;margin:8px 0 8px}.intro p{max-width:none;font-size:12px;line-height:1.6}.stats{display:flex;gap:18px;margin-top:12px;padding-top:0;border-top:0}.stat b{font-size:16px}.stat span{font-size:9px}.mobile-stats{display:none}.controls{align-items:center;flex-direction:row;gap:7px;margin-bottom:11px}.pills{flex:1;gap:5px;flex-wrap:nowrap}.pill{flex:1;white-space:nowrap;padding:8px 7px;font-size:10px}.round-select{flex:none;font-size:10px;padding:7px 0;width:67px}.card{padding:18px 15px 17px;border-radius:15px}.card:before{width:4px}.card-top{font-size:9px}.progress{margin:13px 0 21px}.prompt-label{font-size:9px;margin-bottom:9px}.prompt{font-size:23px;line-height:1.55;margin-bottom:6px}.hint{font-size:11px;margin-bottom:16px}.answers{grid-template-columns:1fr;gap:7px}.answer{min-height:46px;padding:9px 11px;border-radius:9px}.answer-text{font-size:13px;line-height:1.45}.letter{font-size:10px}.feedback{font-size:12px;min-height:32px;padding-top:9px}.actions{margin-top:5px}.btn{padding:10px 14px;font-size:11px}.vocab{margin-top:24px;border-top:1px solid var(--line);padding-top:15px}.vocab-head{align-items:center;margin:0;min-height:32px;cursor:pointer;list-style:none}.vocab-head::-webkit-details-marker{display:none}.vocab-head:after{content:'＋';font:16px 'DM Mono',monospace;color:var(--green);margin-left:10px}.vocab[open] .vocab-head:after{content:'−'}.vocab-head h2{font-size:16px}.vocab-head span{margin-left:auto;font-size:8px}.vocab-list{grid-template-columns:1fr 1fr;gap:0 14px;padding-top:9px}.word{align-items:flex-start;flex-direction:column;gap:3px;padding:9px 1px}.word b{font-size:12px}.word span{text-align:left;font-size:9px}.footer{margin-top:20px;font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><span class="brand-mark">四</span> 사자성어 한 판</div><div class="topnote">작은 공부, 큰 실력 · 30 WORDS</div></header>
<main class="layout">
<aside class="intro"><div class="eyebrow">오늘의 공부</div><h1>알수록 깊어지는<br><em>네 글자의 지혜</em></h1><p>뜻을 보고 사자성어를 맞혀 보세요. 매번 순서가 달라지는 짧은 퀴즈로 가볍게 익혀요.</p><div class="stats"><div class="stat"><b id="stat-accuracy">—</b><span>정답률</span></div><div class="stat"><b id="stat-sessions">0</b><span>완료한 판</span></div></div></aside>
<section class="board" aria-label="사자성어 퀴즈"><div class="controls"><div class="pills" role="group" aria-label="퀴즈 방향"><button class="pill active" data-mode="meaning">뜻 → 사자성어</button><button class="pill" data-mode="word">사자성어 → 뜻</button></div><select id="round-size" class="round-select" aria-label="문제 수"><option value="10">10문제</option><option value="20">20문제</option><option value="30">전체 30문제</option></select></div><div class="card" id="quiz-card" aria-live="polite"></div>
<details class="vocab" open><summary class="vocab-head"><h2>오늘의 단어장</h2><span>THE WHOLE SET · 30</span></summary><div class="vocab-list" id="vocab-list"></div></details>
</section>
</main><footer class="footer">WORDS FROM YOUR STUDY NOTES · 한 문제씩, 꾸준히</footer></div>
<script>
const idioms=[
{word:'대기만성',meaning:'큰 그릇은 늦게 이루어진다. 크게 될 사람은 늦더라도 꼭 성공한다.'},
{word:'마부작침',meaning:'도끼를 갈아 바늘을 만든다. 끊임없이 노력하면 성공을 이룰 수 있다.'},
{word:'우공이산',meaning:'우공이 산을 옮긴다. 어리석어 보이는 일도 끊임없이 노력하면 큰일을 이룰 수 있다.'},
{word:'형설지공',meaning:'반딧불과 눈빛으로 공부한 데서 유래했다. 어려움 속에서도 포기하지 않고 공부해 성공한다.'},
{word:'화룡점정',meaning:'용의 눈동자에 마지막 점을 찍는다. 가장 중요한 부분을 끝내고 완성한다.'},
{word:'군계일학',meaning:'닭 무리 가운데 한 마리의 학. 평범한 사람 가운데 가장 뛰어난 사람.'},
{word:'낭중지추',meaning:'주머니 속의 송곳. 재주가 뛰어난 사람은 저절로 드러난다.'},
{word:'백문불여일견',meaning:'백 번 듣는 것보다 한 번 보는 것이 낫다. 직접 경험해야 확실히 알 수 있다.'},
{word:'백미',meaning:'흰 눈썹. 여럿 중에서 가장 뛰어난 사람이나 물건.'},
{word:'삼고초려',meaning:'오두막집을 세 번 찾아간 일. 뛰어난 인재를 얻으려면 정성을 다해야 한다.'},
{word:'좌우명',meaning:'자리 오른쪽에 두고 마음에 새긴다. 늘 가까이 두고 스스로 경계하거나 가르침으로 삼는 말.'},
{word:'천리안',meaning:'천 리를 볼 수 있는 눈. 먼 데서 일어난 일까지 꿰뚫어 보는 능력.'},
{word:'결초보은',meaning:'풀을 묶어 은혜를 갚는다. 입은 은혜를 잊지 않고 보답한다.'},
{word:'관포지교',meaning:'관중과 포숙아의 사귐. 변하지 않는 친구 사이의 두터운 우정.'},
{word:'단장',meaning:'창자가 끊어질 정도로 가슴 아픈 이별.'},
{word:'도원결의',meaning:'복숭아 동산에서 맺은 의로운 약속. 뜻이 맞는 이들이 목적을 이루려 행동을 함께하기로 맹세한다.'},
{word:'맹모삼천',meaning:'맹자의 어머니가 세 번 집을 옮긴 일. 아이 교육에는 환경이 중요하다.'},
{word:'지음',meaning:'소리를 알아듣는다. 말하지 않아도 속마음을 알아주는 친구.'},
{word:'각주구검',meaning:'배에 표시를 새겨 칼을 찾는다. 낡은 생각만 고집하며 변화를 모르는 어리석음.'},
{word:'기우',meaning:'기나라 사람의 근심. 쓸데없는 걱정이나 안 해도 될 근심.'},
{word:'모순',meaning:'창과 방패. 앞뒤가 서로 맞지 않는 말이나 행동.'},
{word:'사족',meaning:'뱀의 다리. 쓸데없는 짓을 해서 일을 망치는 경우.'},
{word:'새옹지마',meaning:'변방에 사는 늙은이의 말. 세상일의 좋고 나쁨을 미리 알 수 없다.'},
{word:'어부지리',meaning:'어부의 이득. 두 사람이 다투는 사이에 엉뚱한 사람이 이익을 얻는다.'},
{word:'조삼모사',meaning:'아침에 세 개, 저녁에 네 개. 눈앞의 차이만 알고 결과가 같음을 모르는 어리석음.'},
{word:'개과천선',meaning:'지난 잘못을 고쳐 착하게 바뀐다. 잘못을 뉘우치고 새사람이 된다.'},
{word:'교토삼굴',meaning:'교활한 토끼는 굴을 세 개 파둔다. 지혜롭게 준비하여 어려운 일을 면한다.'},
{word:'완벽',meaning:'흠이 없는 완전한 옥구슬. 아무 흠 없이 완전히 뛰어난 것.'},
{word:'일거양득',meaning:'한 번 들어서 두 가지를 얻는다. 한 가지 일로 두 가지 이익을 얻는다.'},
{word:'환골탈태',meaning:'뼛속부터 겉모습까지 완전히 바뀐다. 아름답게 변하거나 완전히 새로워진다.'}
];
let mode='meaning',questions=[],index=0,score=0,answered=false,missed=[];
const saved=(()=>{try{return JSON.parse(localStorage.getItem('fourWordQuizStats')||'{"correct":0,"total":0,"sessions":0}')}catch{return{correct:0,total:0,sessions:0}}})();
const $=s=>document.querySelector(s);const card=$('#quiz-card');
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateStats(){const acc=saved.total?Math.round(saved.correct/saved.total*100)+'%':'—';$('#stat-accuracy').textContent=acc;$('#stat-sessions').textContent=saved.sessions}
function start(){const n=Number($('#round-size').value);questions=shuffle(idioms).slice(0,n);index=0;score=0;answered=false;missed=[];render()}
function render(){if(index>=questions.length){finish();return}const q=questions[index];const correct=mode==='meaning'?q.word:q.meaning;const distractors=shuffle(idioms.filter(x=>x!==q)).slice(0,3).map(x=>mode==='meaning'?x.word:x.meaning);const options=shuffle([correct,...distractors]);const prompt=mode==='meaning'?q.meaning:q.word;const hint=mode==='meaning'?'이 뜻에 알맞은 사자성어는?':'이 사자성어의 뜻은?';card.innerHTML=`<div class="card-top"><span>QUESTION <span class="count">${String(index+1).padStart(2,'0')}</span> / ${questions.length}</span><span>${mode==='meaning'?'뜻에서 찾기':'성어에서 찾기'}</span></div><div class="progress"><i style="width:${index/questions.length*100}%"></i></div><p class="prompt-label">${hint}</p><p class="prompt">${esc(prompt)}</p><p class="hint">보기 중 하나를 골라 주세요.</p><div class="answers">${options.map((o,i)=>`<button class="answer" data-value="${esc(o)}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="answer-text">${esc(o)}</span></button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn" id="next" disabled>${index===questions.length-1?'결과 보기':'다음 문제'} <span aria-hidden="true">→</span></button></div>`;card.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>choose(b,correct,q)));$('#next').addEventListener('click',()=>{index++;answered=false;render()})}
function choose(btn,correct,q){if(answered)return;answered=true;const ok=btn.dataset.value===correct;card.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.value===correct)b.classList.add('correct')});const feedback=$('#feedback');if(ok){score++;feedback.className='feedback good';feedback.innerHTML='<strong>정답이에요!</strong> 잘 기억했어요.'}else{btn.classList.add('wrong');missed.push(q);feedback.className='feedback bad';feedback.innerHTML=`아쉬워요. 정답은 <strong>${esc(correct)}</strong>`}$('#next').disabled=false;$('#next').focus()}
function finish(){saved.correct+=score;saved.total+=questions.length;saved.sessions++;try{localStorage.setItem('fourWordQuizStats',JSON.stringify(saved))}catch{}updateStats();const pct=Math.round(score/questions.length*100);card.innerHTML=`<div class="done"><div class="trophy">${pct===100?'✦':'✓'}</div><div class="eyebrow">ROUND COMPLETE</div><h2>${pct>=80?'멋진 성적이에요!':'한 판 완료!'}</h2><p>이번 판에서 <strong>${questions.length}문제 중 ${score}개</strong>를 맞혔어요.<br>정답률 ${pct}% · 틀린 문제는 한 번 더 익혀 보세요.</p>${missed.length?`<div class="mistakes"><h3>다시 볼 단어</h3>${missed.map(x=>`<p><b>${esc(x.word)}</b>　${esc(x.meaning)}</p>`).join('')}</div>`:''}<div class="actions" style="justify-content:center;margin-top:25px"><button class="btn secondary" id="retry-wrong" ${missed.length?'':'disabled'}>틀린 문제 다시 풀기</button><button class="btn" id="restart">새 퀴즈 시작 <span aria-hidden="true">→</span></button></div></div>`;$('#restart').addEventListener('click',start);$('#retry-wrong').addEventListener('click',()=>{questions=shuffle(missed);index=0;score=0;missed=[];render()})}
function renderWords(){$('#vocab-list').innerHTML=idioms.map(x=>`<div class="word"><b>${esc(x.word)}</b><span>${esc(x.meaning.split('.')[0])}</span></div>`).join('')}
const vocab=$('.vocab'),mobileLayout=window.matchMedia('(max-width:760px)');function fitVocab(){vocab.open=!mobileLayout.matches}fitVocab();mobileLayout.addEventListener?.('change',fitVocab);
document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;start()}));$('#round-size').addEventListener('change',start);renderWords();updateStats();start();
</script>
</body></html>
