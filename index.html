<title>사자성어 탐험대</title>
<style>
:root{--paper:#fff8e9;--ink:#293744;--muted:#657582;--green:#37866d;--deep:#246d58;--mint:#dff5e8;--sun:#ffdf66;--coral:#ff8a70;--line:#e5e4d8;--white:#fff;--red:#bd4b40;--shadow:0 14px 32px #44544512;--round:24px;--sans:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px var(--sans);min-height:100vh}.shell{max-width:1050px;margin:auto;padding:20px 30px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 18px;border-bottom:2px solid #eee8d9}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:850;letter-spacing:-.04em}.brand-mark{display:grid;place-items:center;background:var(--sun);color:#715616;width:38px;height:38px;border-radius:14px;font-size:22px;box-shadow:0 3px 0 #e9c94f}.topnote{color:var(--muted);font-size:12px;font-weight:750}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:46px;padding-top:43px}.intro{padding:5px 0}.eyebrow,.quest-kicker{display:inline-flex;align-items:center;gap:7px;color:var(--deep);font-size:13px;font-weight:850}.eyebrow:before{content:'✦';color:#f2ad38;font-size:16px}.intro h1{font-size:36px;line-height:1.3;letter-spacing:-.06em;margin:13px 0 12px;font-weight:900;word-break:keep-all}.intro h1 em{font-style:normal;color:var(--green)}.intro p{font-size:15px;line-height:1.8;color:#5d6b73;margin:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.stat{background:#fff;border:1px solid #eee8d9;border-radius:17px;padding:13px 12px;box-shadow:0 4px 12px #44544508}.stat b{display:block;color:var(--deep);font-size:23px;line-height:1.1}.stat span{display:block;margin-top:6px;color:var(--muted);font-size:11px;font-weight:750}.board{min-width:0}.quest-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.quest-kicker{font-size:15px;color:#526b57}.quest-kicker span{display:grid;place-items:center;width:32px;height:32px;background:#fff0bd;border-radius:11px;font-size:18px}.quest-note{color:#7a8583;font-size:12px;font-weight:650}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.pills{display:flex;gap:6px;padding:4px;background:#ecefe7;border-radius:14px}.pill{border:0;background:transparent;color:#5e6b68;border-radius:11px;padding:10px 13px;font:800 13px var(--sans);white-space:nowrap}.pill.active{background:#fff;color:var(--deep);box-shadow:0 2px 7px #344e3614}.round-select{border:1px solid #dddcca;border-radius:12px;background:#fff;color:var(--ink);padding:9px 11px;font:750 13px var(--sans);outline:none}.card{position:relative;overflow:hidden;background:var(--white);border:2px solid #eee8d9;border-radius:var(--round);box-shadow:var(--shadow);padding:25px 28px 22px}.card:before{content:'✦';position:absolute;right:22px;top:17px;color:#ffcf56;font-size:18px}.card-top{display:flex;align-items:center;justify-content:space-between;color:#687680;font-size:12px;font-weight:800}.count{color:var(--deep);font-weight:900}.progress{height:9px;background:#eef0e9;margin:13px 0 24px;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#79d3b0,#50b88f);border-radius:99px;transition:width .3s}.prompt-label{display:flex;align-items:center;gap:7px;color:#657582;font-size:14px;font-weight:800;margin:0 0 10px}.prompt-label:before{content:'💡';font-size:17px}.prompt{font-size:24px;line-height:1.65;font-weight:850;letter-spacing:-.035em;margin:0 0 8px;word-break:keep-all}.hint{font-size:13px;color:#7e8b8c;margin:0 0 17px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{display:flex;align-items:center;gap:12px;min-height:64px;padding:13px 15px;text-align:left;background:#fffdf7;border:2px solid #e8e8dc;border-radius:17px;color:var(--ink);transition:transform .15s,border-color .15s,background .15s;touch-action:manipulation}.answer:hover:not(:disabled){border-color:#8ac9a5;background:#f5fff8;transform:translateY(-2px)}.answer:active:not(:disabled){transform:scale(.99)}.answer:disabled{cursor:default}.letter{display:grid;place-items:center;flex:none;width:31px;height:31px;border-radius:11px;background:#f0f1e8;color:#68776e;font-size:13px;font-weight:900}.answer-text{font-size:17px;line-height:1.5;font-weight:750;word-break:keep-all}.answer.correct{border-color:#74c998;background:#edfff3}.answer.correct .letter{background:#c9f1d8;color:#286e4b}.answer.wrong{border-color:#ef9b8b;background:#fff2ee}.answer.wrong .letter{background:#ffe0d8;color:var(--red)}.feedback{display:flex;align-items:center;gap:8px;min-height:42px;padding-top:8px;color:#657582;font-size:14px;font-weight:700}.feedback.good{color:#277350}.feedback.bad{color:#b44c3c}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:5px}.btn{border:0;border-radius:14px;padding:13px 19px;background:var(--green);color:#fff;font:850 14px var(--sans);box-shadow:0 4px 0 var(--deep);transition:transform .15s,opacity .15s;touch-action:manipulation}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--deep)}.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.btn.secondary{background:#fff;border:2px solid #e6e5da;color:#5c6a6b;box-shadow:none}.done{text-align:center;padding:30px 14px}.trophy{display:grid;place-items:center;margin:0 auto 13px;width:70px;height:70px;background:#fff0bd;border-radius:24px;font-size:34px;color:#d89420}.done .eyebrow{justify-content:center}.done h2{font-size:29px;line-height:1.35;margin:11px 0 7px}.done p{color:#657582;font-size:15px;line-height:1.8}.done strong{color:var(--deep)}.mistakes{margin:24px auto 0;text-align:left;max-width:500px}.mistakes h3{font-size:12px;color:#657582}.mistakes p{border-bottom:1px solid var(--line);padding:10px 0;margin:0;color:var(--ink);font-size:14px;line-height:1.7}.vocab{margin-top:28px;border:2px solid #eee8d9;border-radius:18px;background:#fff;padding:15px 17px;box-shadow:0 5px 16px #44544508}.vocab-head{display:flex;align-items:center;min-height:32px;cursor:pointer;list-style:none}.vocab-head::-webkit-details-marker{display:none}.vocab-head:after{content:'＋';font-size:19px;color:var(--green);margin-left:10px;font-weight:800}.vocab[open] .vocab-head:after{content:'−'}.vocab-head h2{font-size:17px;font-weight:900;margin:0}.vocab-head span{margin-left:auto;color:#75817e;font-size:10px;font-weight:800}.vocab-list{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;padding-top:12px}.word{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid #efeee6;padding:9px 2px}.word b{color:#345746;font-size:14px;font-weight:900}.word span{font-size:12px;color:#687680;line-height:1.5}.footer{color:#87918c;font-size:11px;font-weight:700;text-align:center;margin-top:26px}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #eeab36;outline-offset:3px}
@media(max-width:760px){.shell{padding:12px 16px 30px}.topbar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:7px 16px 11px;background:var(--paper);border-bottom:2px solid #eee8d9}.brand{font-size:15px;gap:8px}.brand-mark{width:34px;height:34px;border-radius:12px}.topnote{font-size:10px}.layout{grid-template-columns:1fr;gap:20px;padding-top:20px}.intro{padding:0}.eyebrow{font-size:12px}.intro h1{font-size:29px;line-height:1.24;margin:8px 0}.intro p{font-size:13px;line-height:1.6}.stats{display:flex;gap:8px;margin-top:13px}.stat{flex:1;padding:10px 12px;border-radius:14px}.stat b{font-size:18px}.stat span{font-size:10px;margin-top:4px}.quest-head{margin-bottom:9px}.quest-kicker{font-size:14px}.quest-kicker span{width:29px;height:29px}.quest-note{font-size:10px}.controls{gap:6px;margin-bottom:10px}.pills{flex:1;gap:3px;padding:3px}.pill{flex:1;padding:9px 5px;font-size:11px}.round-select{font-size:11px;padding:8px 5px;width:73px}.card{padding:18px 14px 16px;border-radius:20px}.card:before{right:14px;top:12px;font-size:16px}.card-top{font-size:11px}.progress{height:8px;margin:11px 0 19px}.prompt-label{font-size:13px;margin-bottom:8px}.prompt{font-size:21px;line-height:1.65;margin-bottom:7px}.hint{font-size:12px;margin-bottom:13px}.answers{grid-template-columns:1fr;gap:8px}.answer{min-height:59px;padding:11px 12px;border-radius:15px;gap:10px}.letter{width:32px;height:32px;border-radius:10px;font-size:13px}.answer-text{font-size:16px;line-height:1.5}.feedback{font-size:13px;min-height:39px;padding-top:7px}.btn{padding:12px 16px;font-size:13px}.vocab{margin-top:20px;padding:12px 14px}.vocab-head h2{font-size:15px}.vocab-head span{font-size:9px}.vocab-list{grid-template-columns:1fr 1fr;gap:0 12px;padding-top:8px}.word{gap:4px;padding:8px 1px}.word b{font-size:13px}.word span{font-size:11px}.footer{font-size:9px;margin-top:19px}}
@media(max-width:370px){.shell{padding-left:12px;padding-right:12px}.topbar{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.intro h1{font-size:26px}.pill{font-size:10px}.round-select{width:68px}.prompt{font-size:19px}.answer-text{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><span class="brand-mark">★</span> 사자성어 탐험대</div><div class="topnote">초등 4–5학년 · 30개의 말</div></header>
<main class="layout">
<aside class="intro"><div class="eyebrow">오늘의 말 탐험</div><h1>사자성어<br><em>탐험대 출발!</em></h1><p>재미있는 네 글자 속에 숨은 이야기를 찾아봐요. 한 문제씩 풀다 보면 어느새 내 실력이 쑥쑥 자라요!</p><div class="stats"><div class="stat"><b id="stat-accuracy">—</b><span>정답률</span></div><div class="stat"><b id="stat-sessions">0</b><span>완료한 판</span></div></div></aside>
<section class="board" aria-label="사자성어 퀴즈"><div class="quest-head"><div class="quest-kicker"><span>🎯</span> 오늘의 미션</div><div class="quest-note">천천히 생각하고 골라 봐요</div></div><div class="controls"><div class="pills" role="group" aria-label="퀴즈 방향"><button class="pill active" data-mode="meaning">뜻 보고 맞히기</button><button class="pill" data-mode="word">성어 보고 뜻 찾기</button></div><select id="round-size" class="round-select" aria-label="문제 수"><option value="10">10문제</option><option value="20">20문제</option><option value="30">전체 30문제</option></select></div><div class="card" id="quiz-card" aria-live="polite"></div>
<details class="vocab" open><summary class="vocab-head"><h2>나의 단어 보물상자</h2><span>30개 모두 보기</span></summary><div class="vocab-list" id="vocab-list"></div></details>
</section>
</main><footer class="footer">반짝이는 네 글자, 오늘 하나 더 알아가기 ✨</footer></div>
<script>
const idioms=[
{word:'대기만성',meaning:'큰 그릇은 늦게 이루어진다. 크게 될 사람은 늦더라도 꼭 성공한다.'},
{word:'마부작침',meaning:'도끼를 갈아 바늘을 만든다. 끊임없이 노력하면 성공을 이룰 수 있다.'},
{word:'우공이산',meaning:'우공이 산을 옮긴다. 어리석어 보이는 일도 끊임없이 노력하면 큰일을 이룰 수 있다.'},
{word:'형설지공',meaning:'반딧불과 눈빛으로 공부한 데서 유래했다. 어려움 속에서도 포기하지 않고 공부해 성공한다.'},
{word:'화룡점정',meaning:'용의 눈동자에 마지막 점을 찍는다. 가장 중요한 부분을 끝내고 완성한다.'},
{word:'군계일학',meaning:'닭 무리 가운데 한 마리의 학. 평범한 사람 가운데 가장 뛰어난 사람.'},
{word:'낭중지추',meaning:'주머니 속의 송곳. 재주가 뛰어난 사람은 저절로 드러난다.'},
{word:'백문불여일견',meaning:'백 번 듣는 것보다 한 번 보는 것이 낫다. 직접 경험해야 확실히 알 수 있다.'},
{word:'백미',meaning:'흰 눈썹. 여럿 중에서 가장 뛰어난 사람이나 물건.'},
{word:'삼고초려',meaning:'오두막집을 세 번 찾아간 일. 뛰어난 인재를 얻으려면 정성을 다해야 한다.'},
{word:'좌우명',meaning:'자리 오른쪽에 두고 마음에 새긴다. 늘 가까이 두고 스스로 경계하거나 가르침으로 삼는 말.'},
{word:'천리안',meaning:'천 리를 볼 수 있는 눈. 먼 데서 일어난 일까지 꿰뚫어 보는 능력.'},
{word:'결초보은',meaning:'풀을 묶어 은혜를 갚는다. 입은 은혜를 잊지 않고 보답한다.'},
{word:'관포지교',meaning:'관중과 포숙아의 사귐. 변하지 않는 친구 사이의 두터운 우정.'},
{word:'단장',meaning:'창자가 끊어질 정도로 가슴 아픈 이별.'},
{word:'도원결의',meaning:'복숭아 동산에서 맺은 의로운 약속. 뜻이 맞는 이들이 목적을 이루려 행동을 함께하기로 맹세한다.'},
{word:'맹모삼천',meaning:'맹자의 어머니가 세 번 집을 옮긴 일. 아이 교육에는 환경이 중요하다.'},
{word:'지음',meaning:'소리를 알아듣는다. 말하지 않아도 속마음을 알아주는 친구.'},
{word:'각주구검',meaning:'배에 표시를 새겨 칼을 찾는다. 낡은 생각만 고집하며 변화를 모르는 어리석음.'},
{word:'기우',meaning:'기나라 사람의 근심. 쓸데없는 걱정이나 안 해도 될 근심.'},
{word:'모순',meaning:'창과 방패. 앞뒤가 서로 맞지 않는 말이나 행동.'},
{word:'사족',meaning:'뱀의 다리. 쓸데없는 짓을 해서 일을 망치는 경우.'},
{word:'새옹지마',meaning:'변방에 사는 늙은이의 말. 세상일의 좋고 나쁨을 미리 알 수 없다.'},
{word:'어부지리',meaning:'어부의 이득. 두 사람이 다투는 사이에 엉뚱한 사람이 이익을 얻는다.'},
{word:'조삼모사',meaning:'아침에 세 개, 저녁에 네 개. 눈앞의 차이만 알고 결과가 같음을 모르는 어리석음.'},
{word:'개과천선',meaning:'지난 잘못을 고쳐 착하게 바뀐다. 잘못을 뉘우치고 새사람이 된다.'},
{word:'교토삼굴',meaning:'교활한 토끼는 굴을 세 개 파둔다. 지혜롭게 준비하여 어려운 일을 면한다.'},
{word:'완벽',meaning:'흠이 없는 완전한 옥구슬. 아무 흠 없이 완전히 뛰어난 것.'},
{word:'일거양득',meaning:'한 번 들어서 두 가지를 얻는다. 한 가지 일로 두 가지 이익을 얻는다.'},
{word:'환골탈태',meaning:'뼛속부터 겉모습까지 완전히 바뀐다. 아름답게 변하거나 완전히 새로워진다.'}
];
let mode='meaning',questions=[],index=0,score=0,answered=false,missed=[];
const saved=(()=>{try{return JSON.parse(localStorage.getItem('fourWordQuizStats')||'{"correct":0,"total":0,"sessions":0}')}catch{return{correct:0,total:0,sessions:0}}})();
const $=s=>document.querySelector(s);const card=$('#quiz-card');
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateStats(){const acc=saved.total?Math.round(saved.correct/saved.total*100)+'%':'시작 전';$('#stat-accuracy').textContent=acc;$('#stat-sessions').textContent=saved.sessions+'판'}
function start(){const n=Number($('#round-size').value);questions=shuffle(idioms).slice(0,n);index=0;score=0;answered=false;missed=[];render()}
function render(){if(index>=questions.length){finish();return}const q=questions[index];const correct=mode==='meaning'?q.word:q.meaning;const distractors=shuffle(idioms.filter(x=>x!==q)).slice(0,3).map(x=>mode==='meaning'?x.word:x.meaning);const options=shuffle([correct,...distractors]);const prompt=mode==='meaning'?q.meaning:q.word;const hint=mode==='meaning'?'이 뜻에 알맞은 사자성어는?':'이 사자성어의 뜻은?';card.innerHTML=`<div class="card-top"><span>문제 <span class="count">${String(index+1).padStart(2,'0')}</span> / ${questions.length}</span><span>${mode==='meaning'?'뜻에서 찾기':'성어에서 찾기'}</span></div><div class="progress"><i style="width:${index/questions.length*100}%"></i></div><p class="prompt-label">${hint}</p><p class="prompt">${esc(prompt)}</p><p class="hint">생각이 났다면 보기에서 꾹 눌러 골라 봐요!</p><div class="answers">${options.map((o,i)=>`<button class="answer" data-value="${esc(o)}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="answer-text">${esc(o)}</span></button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn" id="next" disabled>${index===questions.length-1?'결과 보기':'다음 문제'} <span aria-hidden="true">→</span></button></div>`;card.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>choose(b,correct,q)));$('#next').addEventListener('click',()=>{index++;answered=false;render()})}
function choose(btn,correct,q){if(answered)return;answered=true;const ok=btn.dataset.value===correct;card.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.value===correct)b.classList.add('correct')});const feedback=$('#feedback');if(ok){score++;feedback.className='feedback good';feedback.innerHTML='<strong>딩동댕! 정답이에요!</strong> 멋지게 찾았어요 ⭐'}else{btn.classList.add('wrong');missed.push(q);feedback.className='feedback bad';feedback.innerHTML=`괜찮아요! 정답은 <strong>${esc(correct)}</strong>예요. 다음엔 기억날 거예요 🌱`}$('#next').disabled=false;$('#next').focus()}
function finish(){saved.correct+=score;saved.total+=questions.length;saved.sessions++;try{localStorage.setItem('fourWordQuizStats',JSON.stringify(saved))}catch{}updateStats();const pct=Math.round(score/questions.length*100);card.innerHTML=`<div class="done"><div class="trophy">${pct===100?'🏆':pct>=80?'🌟':'🌱'}</div><div class="eyebrow">오늘의 미션 완료!</div><h2>${pct>=80?'대단해요! 탐험 성공!':'끝까지 해냈어요!'}</h2><p>이번 미션에서 <strong>${questions.length}문제 중 ${score}개</strong>를 맞혔어요.<br>정답률 ${pct}% · 틀린 문제도 다시 보면 내 것이 돼요!</p>${missed.length?`<div class="mistakes"><h3>다시 볼 단어</h3>${missed.map(x=>`<p><b>${esc(x.word)}</b>　${esc(x.meaning)}</p>`).join('')}</div>`:''}<div class="actions" style="justify-content:center;margin-top:25px"><button class="btn secondary" id="retry-wrong" ${missed.length?'':'disabled'}>틀린 문제 다시 풀기</button><button class="btn" id="restart">새 퀴즈 시작 <span aria-hidden="true">→</span></button></div></div>`;$('#restart').addEventListener('click',start);$('#retry-wrong').addEventListener('click',()=>{questions=shuffle(missed);index=0;score=0;missed=[];render()})}
function renderWords(){$('#vocab-list').innerHTML=idioms.map(x=>`<div class="word"><b>${esc(x.word)}</b><span>${esc(x.meaning.split('.')[0])}</span></div>`).join('')}
const vocab=$('.vocab'),mobileLayout=window.matchMedia('(max-width:760px)');function fitVocab(){vocab.open=!mobileLayout.matches}fitVocab();mobileLayout.addEventListener?.('change',fitVocab);
document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;start()}));$('#round-size').addEventListener('change',start);renderWords();updateStats();start();
</script>
</body></html>
